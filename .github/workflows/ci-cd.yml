name: Secure CI/CD Pipeline

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  security-check:
    runs-on: self-hosted

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Check for leaked secrets
        run: |
          echo "Checking repository for sensitive files..."

          if find . -type f \
            \( -name ".env" -o -name ".credentials" -o -name "*.pem" -o -name "*.key" \) \
            -not -path "./.git/*" \
            -not -path "./actions-runner/*" | grep -q .; then
            echo "Potential secret files found!"
            exit 1
          fi

          echo "No obvious secret files found."

  build:
    runs-on: self-hosted
    needs: security-check

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Build Docker images
        run: |
          docker compose build

      - name: Validate Docker Compose
        run: |
          docker compose config

  deploy:
    runs-on: self-hosted
    needs: build

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Deploy application
        run: |
          docker compose up -d

      - name: Show running containers
        run: |
          docker compose ps
