name: Secure CI/CD Security Pipeline

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:

  trufflehog:
    name: TruffleHog Secret Scan
    runs-on: self-hosted

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Run TruffleHog
        uses: trufflesecurity/trufflehog@main
        with:
          path: ./
          extra_args: --only-verified


  bandit:
    name: Bandit Python SAST
    runs-on: self-hosted

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Create Python virtual environment
        run: |
          python3 -m venv .bandit-venv

      - name: Install Bandit
        run: |
          .bandit-venv/bin/python -m pip install --upgrade pip
          .bandit-venv/bin/pip install bandit

      - name: Run Bandit
        run: |
          .bandit-venv/bin/bandit -r backend -ll


  hadolint:
    name: Hadolint Dockerfile Scan
    runs-on: self-hosted

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Run Hadolint on Backend Dockerfile
        run: |
          docker run --rm \
            -i \
            hadolint/hadolint:latest \
            hadolint - < backend/Dockerfile

      - name: Run Hadolint on Frontend Dockerfile
        run: |
          docker run --rm \
            -i \
            hadolint/hadolint:latest \
            hadolint - < frontend/Dockerfile


  trivy:
    name: Trivy Container Vulnerability Scan
    runs-on: self-hosted

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Build Docker images
        run: |
          docker compose build

      - name: Scan Backend image
        run: |
          docker run --rm \
            -v /var/run/docker.sock:/var/run/docker.sock \
            aquasec/trivy:latest \
            image \
            --severity HIGH,CRITICAL \
            --exit-code 0 \
            secure-fullstack-app-backend:latest

      - name: Scan Frontend image
        run: |
          docker run --rm \
            -v /var/run/docker.sock:/var/run/docker.sock \
            aquasec/trivy:latest \
            image \
            --severity HIGH,CRITICAL \
            --exit-code 0 \
            secure-fullstack-app-frontend:latest


  security-check:
    name: Security Files Check
    runs-on: self-hosted

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Check for leaked secrets
        run: |
          echo "Checking repository for sensitive files..."

          if find . -type f \
            \( -name ".env" -o -name ".credentials" -o -name "*.pem" -o -name "*.key" \) \
            -not -path "./.git/*" \
            -not -path "./actions-runner/*" \
            -not -path "./.bandit-venv/*" | grep -q .; then
            echo "Potential secret files found!"
            exit 1
          fi

          echo "No obvious secret files found."


  build:
    name: Build Application
    runs-on: self-hosted
    needs:
      - security-check
      - trufflehog
      - bandit
      - hadolint
      - trivy

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Build Docker images
        run: |
          docker compose build

      - name: Validate Docker Compose
        run: |
          docker compose config


  deploy:
    name: Deploy Application
    runs-on: self-hosted
    needs: build

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Deploy application
        run: |
          docker compose up -d

      - name: Show running containers
        run: |
          docker compose ps
